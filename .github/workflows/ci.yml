name: CI

# Every commit is checked exactly once, including commits pushed before a pull
# request exists.
#
# `push` covers every branch, so work is checked from the first commit rather
# than from whenever a PR happens to be opened. `pull_request` is then narrowed
# to the events that are *not* a push — opening, reopening, and leaving draft —
# because listening to `synchronize` as well would run every PR commit twice.
# Deduping those two with a shared concurrency group is not equivalent: the
# loser is cancelled, which GitHub reports as a red check on a commit that
# passed.
#
# The gap this leaves is a fork PR, where pushes to the fork do not reach this
# repository. There are no forks; if that changes, add `synchronize` back and
# accept the duplicate runs on same-repo branches.
on:
  push:
  pull_request:
    types: [opened, reopened, ready_for_review]

# Superseded runs on the same branch are still cancelled — that is a genuinely
# obsolete run, not a duplicate of a live one. The repository half of the key
# keeps two fork PRs from branches both named `main` out of each other's group.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Format
        run: npm run format:check

      # Invariants 2, 3, and 6: no wall-clock time, no unseeded randomness, no
      # DOM, no Node built-ins, no network anywhere in the engine.
      - name: Purity gate
        run: npm run gate:purity

      # Includes the golden replay suite. A recorded fixture that differs by a
      # single byte fails here; CI never re-records.
      - name: Test
        run: npm test
