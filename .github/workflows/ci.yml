name: CI

# Every commit is checked exactly once. A branch push fires `pull_request`
# (synchronize) once its PR is open, so listening to `push` on all branches as
# well would double every run — and deduping those two events with a shared
# concurrency group means the loser is *cancelled*, which GitHub reports as a
# red check on a commit that passed. One trigger per context avoids both.
on:
  push:
    branches: [main]
  pull_request:

# Superseded runs on the same branch are still cancelled — that is a genuinely
# obsolete run, not a duplicate of a live one. The repository half of the key
# keeps two fork PRs from branches both named `main` out of each other's group.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Format
        run: npm run format:check

      # Invariants 2, 3, and 6: no wall-clock time, no unseeded randomness, no
      # DOM, no Node built-ins, no network anywhere in the engine.
      - name: Purity gate
        run: npm run gate:purity

      # Includes the golden replay suite. A recorded fixture that differs by a
      # single byte fails here; CI never re-records.
      - name: Test
        run: npm test
